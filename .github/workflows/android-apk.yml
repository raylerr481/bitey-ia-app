name: Build Bitey IA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: 1
  CI: 1

jobs:
  build-apk:
    name: Build Bitey IA APK on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate Expo project
        run: npx expo-doctor@latest

      - name: Initialize EAS project when not linked
        shell: bash
        run: |
          if node -e "const c=require('./app.json').expo; process.exit(c.extra?.eas?.projectId ? 0 : 1)"; then
            echo "EAS project already linked."
          else
            echo "No EAS projectId found; initializing under rayler..."
            eas init --account rayler --non-interactive
          fi

      - name: Verify EAS project
        run: eas project:info

      - name: Build APK on EAS
        run: eas build --platform android --profile production-apk --non-interactive --wait
