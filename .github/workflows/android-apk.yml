name: Build Bitey IA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: 1
  CI: 1

jobs:
  build-apk:
    name: Build Bitey IA APK on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Initialize/link EAS project
        run: eas init --force --non-interactive

      - name: Build APK on EAS
        run: eas build --platform android --profile production-apk --non-interactive --wait
